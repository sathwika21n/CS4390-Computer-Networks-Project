# Configure tracker_host/tracker_port to match the tracker server.
tracker_host=127.0.0.1
tracker_port=3490

# The reachable address and TCP port this peer advertises to the tracker.
# On another machine, replace 127.0.0.1 with this machine's LAN address.
peer_ip=127.0.0.1
peer_port=3490

shared_dir=./shared
download_dir=./downloads
update_interval=60